apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: localpaste
  namespace: localpaste
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: paste.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { number: 8000 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
  tls:
    - hosts: [paste.example.com]
      secretName: localpaste-tls
