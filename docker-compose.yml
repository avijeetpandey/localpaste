version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: localpaste-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localpaste}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localpaste_secret}
      POSTGRES_DB: ${POSTGRES_DB:-localpaste}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-localpaste} -d ${POSTGRES_DB:-localpaste}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - localpaste-net

  redis:
    image: redis:7-alpine
    container_name: localpaste-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - localpaste-net

  minio:
    image: minio/minio:latest
    container_name: localpaste-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - localpaste-net

  minio-init:
    image: minio/mc:latest
    container_name: localpaste-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin123};
      mc mb -p local/${MINIO_BUCKET:-pastes} || true;
      mc anonymous set download local/${MINIO_BUCKET:-pastes} || true;
      echo 'MinIO bucket initialised';
      "
    networks:
      - localpaste-net

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: localpaste-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-localpaste}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-localpaste_ch}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-localpaste}
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./scripts/init-clickhouse.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - localpaste-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: localpaste-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      CLICKHOUSE_HOST: clickhouse
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - localpaste-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: localpaste-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - localpaste-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clickhouse-data:

networks:
  localpaste-net:
    driver: bridge
